<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>My Accounts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 21V11h14v10zM9 15h14' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot" class="center-screen"><p>Loading…</p></div>

<div id="login" class="center-screen" hidden>
  <form id="loginForm" class="card login-card" novalidate>
    <h1>My Accounts</h1>
    <p class="muted">Private. Sign in to continue.</p>
    <label>Email
      <input type="email" name="email" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <label class="check">
      <input type="checkbox" name="remember"> Keep me signed in on this device
    </label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" type="submit">Sign in</button>
    <button class="btn link" type="button" id="forgot">Forgot password?</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <h1>My Accounts</h1>
    <nav id="nav">
      <button data-act="nav" data-view="dashboard">Dashboard</button>
      <button data-act="nav" data-view="transactions">Transactions</button>
      <button data-act="nav" data-view="accounts">Accounts</button>
      <button data-act="nav" data-view="settings">Settings</button>
    </nav>
    <div class="who">
      <span id="who" class="muted"></span>
      <button class="btn small" id="signoutBtn" data-act="signout">Sign out</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" hidden></div>

<script src="vendor/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
